
<!DOCTYPE html>
<html lang="es">
<head>
    <script>
        window.history.replaceState(null, "", "/TIENLY/?shop=naya&v=comiccon");
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sticker & Design Studio</title>
    <style>
        :root {
            --primary: #6f42c1;
            --primary-light: #f3f0ff;
            --dark: #1e1e24;
            --bg-interno: #f8f9fa;
            --border: #e2e8f0;
            --nav-height: 70px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-interno); color: var(--dark); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- APP CONTAINER & NAVIGATION --- */
        .app-container { display: flex; flex: 1; height: calc(100vh - var(--nav-height)); overflow: hidden; position: relative; }
        .section-view { display: none; flex-direction: column; width: 100%; height: 100%; padding: 20px; overflow: hidden; background: #fff; }
        .section-view.active { display: flex; }
        .scrollable-content { flex: 1; overflow-y: auto; padding-bottom: 80px; }

        .mobile-nav { display: flex; background: white; border-top: 1px solid var(--border); height: var(--nav-height); position: fixed; bottom: 0; width: 100%; z-index: 2000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600; color: #868e96; background: none; border: none; cursor: pointer; gap: 4px; }
        .nav-tab.active { color: var(--primary); background: var(--primary-light); }

        /* --- MOCKUP WORKSPACE --- */
        .render-container { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .mockup-wrapper { width: 100%; max-width: 360px; height: 320px; display: flex; justify-content: center; align-items: center; background: #f1f3f5; border-radius: 16px; border: 2px dashed var(--border); position: relative; overflow: hidden; }

        /* Tarjeta Base */
        .tarjeta-mockup {
            width: 300px; height: 188px;
            border-radius: 12px;
            background-color: #2b2d42;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
            transition: width 0.3s, height 0.3s, border-radius 0.3s;
            overflow: hidden;
        }

        /* Orientación Vertical */
        .tarjeta-mockup.vertical { width: 188px; height: 300px; }

        /* Chip Interactivo */
        .tarjeta-mockup .chip {
            width: 44px; height: 32px;
            background: linear-gradient(135deg, #ffd700 0%, #cca100 100%);
            border-radius: 5px; position: absolute; top: 45%; left: 20px;
            transform: translateY(-50%); z-index: 3; border: 1px solid rgba(0,0,0,0.2);
            display: block;
        }
        .tarjeta-mockup.no-chip .chip { display: none !important; }

        /* Modificadores Camiseta y Termo */
        .tarjeta-mockup.tipo-Camiseta { width: 220px; height: 240px; border-radius: 10px 10px 40px 40px; background-color: #ffffff; border: 1px solid var(--border); }
        .tarjeta-mockup.tipo-Camiseta .chip { display: none !important; }
        .tarjeta-mockup.tipo-Termo { width: 130px; height: 250px; border-radius: 12px 12px 25px 25px; clip-path: polygon(5% 0%, 95% 0%, 85% 100%, 15% 100%); }
        .tarjeta-mockup.tipo-Termo .chip { display: none !important; }

        /* --- FORMULARIOS Y CONTROLES --- */
        .form-controls { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }
        .control-group { display: flex; gap: 8px; align-items: center; }
        .control-group label { font-size: 0.8rem; font-weight: bold; width: 90px; color: #555; }
        
        input, select, textarea, button { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; width: 100%; }
        input[type="range"] { padding: 0; }
        
        .btn-action { background: var(--primary); color: white; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 8px; }
        .btn-action:active { transform: scale(0.98); }

        /* --- CATÁLOGO --- */
        .grid-catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .card-item { background: white; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; cursor: pointer; }
        .card-img { width: 100%; height: 110px; background-size: cover; background-position: center; background-color: #eee; }
        .card-info { padding: 8px; font-size: 0.8rem; }

        .tag-badge { background: #e9ecef; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; cursor: pointer; display: inline-block; margin-right: 4px; }
        .tag-badge.active { background: var(--primary); color: white; }

        #toast { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); background: var(--dark); color: white; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 3000; }
        #toast.show { opacity: 1; }

        @media (min-width: 768px) {
            .mobile-nav { display: none; }
            .app-container { display: grid; grid-template-columns: 1fr 1fr 1fr; }
            .section-view { display: flex !important; border-right: 1px solid var(--border); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- VISTA MOCKUP -->
        <main id="view-render" class="section-view active">
            <h3 style="margin-bottom: 10px;">🎨 Personalizador de Sticker</h3>
            <div class="scrollable-content render-container">
                
                <div class="mockup-wrapper">
                    <div class="tarjeta-mockup" id="sticker-preview">
                        <div class="chip" id="card-chip"></div>
                    </div>
                </div>

                <div class="form-controls">
                    <!-- Ajustes de plantilla -->
                    <div class="control-group">
                        <select id="select-tipo" onchange="actualizarPlantilla()">
                            <option value="Tarjeta">💳 Tarjeta / Sticker</option>
                            <option value="Camiseta">👕 Camiseta</option>
                            <option value="Termo">🥤 Termo / Vaso</option>
                        </select>
                        <select id="select-orientacion" onchange="actualizarPlantilla()">
                            <option value="horizontal">↔️ Horizontal</option>
                            <option value="vertical">↕️ Vertical</option>
                        </select>
                    </div>

                    <!-- Toggle del Chip -->
                    <div style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600;">
                        <input type="checkbox" id="check-chip" checked onchange="actualizarPlantilla()" style="width: auto;">
                        <label for="check-chip">Mostrar Chip de Tarjeta</label>
                    </div>

                    <!-- Ajustes de Imagen (Zoom & Posición) -->
                    <div class="control-group">
                        <label>Zoom</label>
                        <input type="range" id="zoom-img" min="50" max="250" value="100" oninput="aplicarEstilosImagen()">
                    </div>
                    <div class="control-group">
                        <label>Posición X</label>
                        <input type="range" id="pos-x" min="0" max="100" value="50" oninput="aplicarEstilosImagen()">
                    </div>
                    <div class="control-group">
                        <label>Posición Y</label>
                        <input type="range" id="pos-y" min="0" max="100" value="50" oninput="aplicarEstilosImagen()">
                    </div>

                    <!-- Entradas de datos -->
                    <input type="file" id="file-input" accept="image/*" onchange="cargarImagenLocal(event)">
                    <input type="text" id="url-input" placeholder="O pega el link de la imagen..." oninput="cargarImagenURL()">
                    <input type="text" id="nombre-diseno" placeholder="Nombre del diseño (Ej: Cyberpunk)">
                    <input type="text" id="tag-diseno" placeholder="Categoría / Tag (Ej: Anime)">
                    <input type="text" id="contacto-cliente" placeholder="Tu WhatsApp o Instagram">

                    <button class="btn-action" onclick="guardarDiseno()">Publicar / Encargar</button>
                </div>
            </div>
        </main>

        <!-- VISTA CATÁLOGO -->
        <section id="view-catalogo" class="section-view">
            <h3 style="margin-bottom: 10px;">🛍️ Catálogo</h3>
            <input type="text" id="buscar-catalogo" placeholder="🔍 Buscar..." oninput="renderCatalogo()" style="margin-bottom: 10px;">
            <div id="tags-container" style="margin-bottom: 10px; overflow-x: auto; white-space: nowrap;"></div>
            <div class="scrollable-content">
                <div class="grid-catalogo" id="contenedor-catalogo"></div>
            </div>
        </section>

        <!-- VISTA MONITOR / BACKEND -->
        <aside id="view-monitor" class="section-view">
            <h3>🖥️ Pedidos Recibidos</h3>
            <div class="scrollable-content" id="lista-pedidos" style="margin-top: 10px;"></div>
        </aside>
    </div>

    <!-- Navegación Móvil -->
    <nav class="mobile-nav">
        <button class="nav-tab active" onclick="switchTab('view-render', this)">🎨 Editor</button>
        <button class="nav-tab" onclick="switchTab('view-catalogo', this)">🛍️ Catálogo</button>
        <button class="nav-tab" onclick="switchTab('view-monitor', this)">🖥️ Pedidos</button>
    </nav>

    <div id="toast"></div>

    <script>
        // CONFIGURACIÓN BACKEND (Coloca la URL desplegada de Google Apps Script)
        const GAS_URL = ""; 

        // ESTADO GLOBAL
        let currentImageSrc = "";
        let db;
        let catalogoGlobal = [];
        let pedidosGlobal = [];
        let tagActivo = "Todos";

        // INICIALIZACIÓN INDEXEDDB (Para guardar localmente sin límites de memory/localStorage)
        const request = indexedDB.open("StickerStudioDB", 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            db.createObjectStore("misDisenos", { keyPath: "id", autoIncrement: true });
        };
        request.onsuccess = (e) => {
            db = e.target.result;
            cargarDisenosLocales();
        };

        window.addEventListener('DOMContentLoaded', () => {
            sincronizarConBackend();
        });

        // --- MANEJO DE MOCKUP Y STYLES ---
        function actualizarPlantilla() {
            const preview = document.getElementById('sticker-preview');
            const tipo = document.getElementById('select-tipo').value;
            const orientacion = document.getElementById('select-orientacion').value;
            const tieneChip = document.getElementById('check-chip').checked;

            preview.className = `tarjeta-mockup tipo-${tipo} ${orientacion}`;
            if (!tieneChip) preview.classList.add('no-chip');
            else preview.classList.remove('no-chip');
        }

        function aplicarEstilosImagen() {
            const preview = document.getElementById('sticker-preview');
            const zoom = document.getElementById('zoom-img').value;
            const posX = document.getElementById('pos-x').value;
            const posY = document.getElementById('pos-y').value;

            preview.style.backgroundImage = `url('${currentImageSrc}')`;
            preview.style.backgroundSize = `${zoom}%`;
            preview.style.backgroundPosition = `${posX}% ${posY}%`;
        }

        function cargarImagenLocal(event) {
            const file = event.target.files[0];
            if (file) {
                // Genera URL temporal en memoria RAM (Zero consumo de almacenamiento)
                currentImageSrc = URL.createObjectURL(file);
                aplicarEstilosImagen();
            }
        }

        function cargarImagenURL() {
            const url = document.getElementById('url-input').value.trim();
            if (url) {
                currentImageSrc = url;
                aplicarEstilosImagen();
            }
        }

        // --- GUARDADO Y PROCESAMIENTO ---
        async function guardarDiseno() {
            const nombre = document.getElementById('nombre-diseno').value.trim() || "Sin Nombre";
            const tag = document.getElementById('tag-diseno').value.trim() || "General";
            const contacto = document.getElementById('contacto-cliente').value.trim();

            if (!contacto) {
                mostrarToast("⚠️ Añade tu contacto para procesar.");
                return;
            }

            const nuevoItem = { nombre, tag, contacto, url: currentImageSrc, fecha: new Date().toISOString() };

            // 1. Guardado local en IndexedDB
            const tx = db.transaction(["misDisenos"], "readwrite");
            tx.objectStore("misDisenos").add(nuevoItem);

            // 2. Enviar a Google Apps Script si está configurado
            if (GAS_URL) {
                try {
                    await fetch(GAS_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(nuevoItem)
                    });
                } catch (e) { console.error(e); }
            }

            mostrarToast("🚀 ¡Diseño registrado!");
            cargarDisenosLocales();
            limpiarFormulario();
        }

        function cargarDisenosLocales() {
            if (!db) return;
            const tx = db.transaction(["misDisenos"], "readonly");
            const store = tx.objectStore("misDisenos");
            const req = store.getAll();
            req.onsuccess = () => {
                catalogoGlobal = req.result;
                renderCatalogo();
            };
        }

        async function sincronizarConBackend() {
            if (!GAS_URL) return;
            try {
                const res = await fetch(GAS_URL);
                const data = await res.json();
                if (data.catalogo) {
                    catalogoGlobal = [...catalogoGlobal, ...data.catalogo];
                    renderCatalogo();
                }
                if (data.pedidos) {
                    pedidosGlobal = data.pedidos;
                    renderPedidos();
                }
            } catch (e) {
                console.log("Servidor backend no disponible.");
            }
        }

        // --- RENDERIZADO DE VISTAS ---
        function renderCatalogo() {
            const contenedor = document.getElementById('contenedor-catalogo');
            const busqueda = document.getElementById('buscar-catalogo').value.toLowerCase();

            // Tags
            const tags = ['Todos', ...new Set(catalogoGlobal.map(i => i.tag))];
            document.getElementById('tags-container').innerHTML = tags.map(t => `
                <span class="tag-badge ${tagActivo === t ? 'active' : ''}" onclick="filtrarTag('${t}')">${t}</span>
            `).join('');

            const filtrados = catalogoGlobal.filter(i => {
                const matchTag = tagActivo === 'Todos' || i.tag === tagActivo;
                const matchTxt = i.nombre.toLowerCase().includes(busqueda) || i.tag.toLowerCase().includes(busqueda);
                return matchTag && matchTxt;
            });

            contenedor.innerHTML = filtrados.map(item => `
                <div class="card-item" onclick="seleccionarDelCatalogo('${item.url}')">
                    <div class="card-img" style="background-image: url('${item.url}')"></div>
                    <div class="card-info">
                        <strong>${item.nombre}</strong><br>
                        <span style="color:var(--primary)">🏷️ ${item.tag}</span>
                    </div>
                </div>
            `).join('');
        }

        function seleccionarDelCatalogo(url) {
            currentImageSrc = url;
            aplicarEstilosImagen();
            switchTab('view-render', document.querySelectorAll('.nav-tab')[0]);
        }

        function filtrarTag(tag) {
            tagActivo = tag;
            renderCatalogo();
        }

        function renderPedidos() {
            const contenedor = document.getElementById('lista-pedidos');
            contenedor.innerHTML = pedidosGlobal.map(p => `
                <div style="border-left:4px solid var(--primary); padding:10px; background:#f8f9fa; margin-bottom:8px; border-radius:4px;">
                    <strong>${p.nombre}</strong> - ${p.contacto}<br>
                    <small>Tag: ${p.tag}</small>
                </div>
            `).join('');
        }

        // --- UI UTILS ---
        function switchTab(viewId, btn) {
            document.querySelectorAll('.section-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            if (btn) btn.classList.add('active');
        }

        function mostrarToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function limpiarFormulario() {
            document.getElementById('nombre-diseno').value = '';
            document.getElementById('contacto-cliente').value = '';
            document.getElementById('url-input').value = '';
            document.getElementById('file-input').value = '';
        }
    </script>
</body>
</html>
