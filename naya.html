<!DOCTYPE html>
<html lang="es">
<head>
    <script>
        window.history.replaceState(null, "", "/TIENLY/?shop=naya&v=comiccon");
    </script
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sticker & Shirt Studio</title>
    <style>
        :root {
            --primary: #6f42c1;
            --primary-light: #f3f0ff;
            --success: #25D366;
            --dark: #1e1e24;
            --bg-interno: #f8f9fa;
            --border: #e2e8f0;
            --nav-height: 65px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-interno);
            color: var(--dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-container { display: flex; flex: 1; height: calc(100vh - var(--nav-height)); overflow: hidden; position: relative; }
        .section-view { display: none; flex-direction: column; width: 100%; height: 100%; padding: 15px; overflow: hidden; background: #ffffff; }
        .section-view.active { display: flex; }
        .scrollable-content { flex: 1; overflow-y: auto; padding-bottom: 30px; -webkit-overflow-scrolling: touch; }

        .mobile-nav { display: flex; background: white; border-top: 1px solid var(--border); height: var(--nav-height); position: fixed; bottom: 0; width: 100%; z-index: 2000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600; color: #868e96; background: none; border: none; cursor: pointer; gap: 3px; }
        .nav-tab.active { color: var(--primary); background: var(--primary-light); }

        /* --- MOCKUP WORKSPACE --- */
        .render-container { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
        
        .mockup-wrapper {
            width: 100%;
            max-width: 340px;
            min-height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            border-radius: 16px;
            border: 2px dashed #cbd5e1;
            position: relative;
            flex-shrink: 0;
            padding: 15px;
        }

        /* Tarjeta de Crédito Horizontal / Vertical */
        .tarjeta-mockup {
            width: 280px; height: 175px;
            border-radius: 12px;
            background: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
            background-size: cover; background-position: center;
            position: relative;
            box-shadow: 0 12px 28px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
            flex-shrink: 0; overflow: hidden;
        }
        .tarjeta-mockup.vertical { width: 175px; height: 280px; }

        /* Chip Ajustable según Orientación */
        .tarjeta-mockup .chip {
            width: 42px; height: 32px;
            background: linear-gradient(135deg, #ffd700 0%, #cca100 100%);
            border-radius: 5px; position: absolute; top: 45%; left: 18px;
            transform: translateY(-50%); z-index: 3;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
            border: 1px solid rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .tarjeta-mockup.vertical .chip {
            top: 18px; left: 50%;
            transform: translateX(-50%) rotate(90deg);
        }

        /* Camiseta con Tinte de Color Dinámico */
        .mockup-camiseta {
            width: 250px; height: 250px;
            background-size: contain; background-position: center; background-repeat: no-repeat;
            background-blend-mode: multiply;
            background-color: #ffffff;
            border-radius: 12px; display: flex; justify-content: center; align-items: center;
            flex-shrink: 0; transition: background-color 0.2s ease;
        }
        .area-impresion {
            width: 100px; height: 130px;
            border: 2px dashed var(--primary);
            background-size: cover; background-position: center;
            border-radius: 4px; transform: translateY(-5px);
        }

        /* --- UI CONTROLES --- */
        .form-controls { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; }
        .row-group { display: flex; gap: 8px; align-items: center; }
        .row-group label { font-size: 0.78rem; font-weight: bold; width: 85px; color: #555; }

        input, select, button { padding: 9px 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 0.88rem; outline: none; width: 100%; }
        
        /* Switch de Fuente de Imagen */
        .tab-selector { display: flex; background: #e2e8f0; border-radius: 8px; padding: 2px; gap: 2px; }
        .tab-btn { border: none; padding: 6px; font-size: 0.78rem; font-weight: 600; background: transparent; cursor: pointer; border-radius: 6px; }
        .tab-btn.active { background: white; color: var(--primary); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

        .btn-action { background: var(--primary); color: white; border: none; padding: 11px; font-weight: 700; border-radius: 8px; cursor: pointer; }
        .btn-whatsapp { background: var(--success); color: white; border: none; padding: 11px; font-weight: 700; border-radius: 8px; cursor: pointer; }

        /* --- CATÁLOGO --- */
        .grid-catalogo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card-item { background: white; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; cursor: pointer; }
        .card-img { width: 100%; height: 105px; background-size: cover; background-position: center; background-color: #eee; }
        .card-info { padding: 6px 8px; font-size: 0.78rem; }

        .tag-badge { background: #e9ecef; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; cursor: pointer; display: inline-block; margin-right: 4px; white-space: nowrap; }
        .tag-badge.active { background: var(--primary); color: white; }

        #toast { position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%); background: var(--dark); color: white; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 3000; }
        #toast.show { opacity: 1; }

        @media (min-width: 768px) {
            .mobile-nav { display: none; }
            .app-container { display: grid; grid-template-columns: 1fr 1fr 1fr; }
            .section-view { display: flex !important; border-right: 1px solid var(--border); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- VISTA MOCKUP -->
        <main id="view-render" class="section-view active">
            <h3 style="margin-bottom: 8px;">🎨 Personalizador de Sticker</h3>
            <div class="scrollable-content render-container">
                
                <div class="mockup-wrapper" id="contenedor-mockup">
                    <div class="tarjeta-mockup" id="sticker-preview">
                        <div class="chip" id="card-chip"></div>
                    </div>
                </div>

                <div class="form-controls">
                    <!-- Selección de Producto -->
                    <div class="row-group">
                        <label>Producto</label>
                        <select id="select-soporte" onchange="actualizarInterfazSoporte()">
                            <option value="tarjeta">💳 Sticker Tarjeta</option>
                            <option value="camiseta">👕 Camiseta</option>
                        </select>
                    </div>

                    <!-- Controles Específicos para Tarjeta -->
                    <div id="controles-tarjeta" class="form-controls">
                        <div class="row-group">
                            <label>Orientación</label>
                            <select id="select-orientacion" onchange="cambiarOrientacion()">
                                <option value="horizontal">↔️ Horizontal</option>
                                <option value="vertical">↕️ Vertical</option>
                            </select>
                        </div>
                        <div style="display:flex; align-items:center; gap:8px; font-size:0.8rem; font-weight:bold;">
                            <input type="checkbox" id="check-chip" checked onchange="toggleChip()" style="width:auto;">
                            <label for="check-chip">Mostrar Chip de Tarjeta</label>
                        </div>
                    </div>

                    <!-- Controles Específicos para Camiseta -->
                    <div id="controles-camiseta" class="form-controls" style="display:none;">
                        <div class="row-group">
                            <label>Modelo</label>
                            <select id="select-genero-camiseta" onchange="cambiarImagenCamiseta()">
                                <option value="hombre">👨 Hombre</option>
                                <option value="mujer">👩 Mujer</option>
                            </select>
                        </div>
                        <div class="row-group">
                            <label>Color Tela</label>
                            <input type="color" id="color-camiseta" value="#ffffff" oninput="cambiarColorCamiseta()">
                        </div>
                    </div>

                    <!-- Ajustes de Diseño (Zoom / Patrón) -->
                    <div class="row-group">
                        <label>Zoom</label>
                        <input type="range" id="slider-zoom" min="30" max="250" value="100" oninput="ajustarImagen()">
                    </div>
                    <div class="row-group">
                        <label>Modo Imagen</label>
                        <select id="select-repeat" onchange="ajustarImagen()">
                            <option value="no-repeat">🖼️ Imagen Única</option>
                            <option value="repeat">🔁 Repetir (Patrón)</option>
                        </select>
                    </div>

                    <!-- Selector Inteligente Fuente Imagen -->
                    <div class="tab-selector">
                        <button class="tab-btn active" id="btn-tab-file" onclick="switchFuenteImagen('file')">📁 Cargar Archivo</button>
                        <button class="tab-btn" id="btn-tab-url" onclick="switchFuenteImagen('url')">🔗 Desde URL</button>
                    </div>

                    <div id="sec-input-file">
                        <input type="file" id="file-input" accept="image/*" onchange="cargarFotoLocal(event)">
                    </div>
                    <div id="sec-input-url" style="display:none;">
                        <input type="text" id="url-input" placeholder="Pega el link de la imagen aquí..." oninput="cargarFotoURL()">
                    </div>

                    <input type="text" id="nombre-diseno" placeholder="Nombre del diseño (Ej: Naruto Modo Sabio)">
                    <input type="text" id="categoria-input" list="lista-categorias-dinamica" placeholder="Categoría (Ej: Anime)">
                    <datalist id="lista-categorias-dinamica"></datalist>

                    <button class="btn-action" onclick="guardarDisenoComunitario()">✨ Publicar en Catálogo</button>
                    <button class="btn-whatsapp" onclick="pedirPorWhatsApp()">💬 Pedir por WhatsApp</button>
                </div>
            </div>
        </main>

        <!-- VISTA CATÁLOGO -->
        <section id="view-catalogo" class="section-view">
            <h3 style="margin-bottom: 8px;">🛍️ Catálogo Comunitario</h3>
            <input type="text" id="buscar-catalogo" placeholder="🔍 Buscar..." oninput="renderCatalogo()" style="margin-bottom: 8px;">
            <div id="tags-bar" style="margin-bottom: 8px; overflow-x: auto; white-space: nowrap;"></div>
            <div class="scrollable-content">
                <div class="grid-catalogo" id="contenedor-catalogo"></div>
            </div>
        </section>

        <!-- VISTA PERFIL DE USUARIO -->
        <aside id="view-perfil" class="section-view">
            <h3>👤 Perfil de Usuario</h3>
            <div style="background:#e2e8f0; padding:10px; border-radius:8px; margin: 10px 0; font-size:0.85rem;">
                <strong>ID de Cliente:</strong> <span id="user-id-display" style="color:var(--primary);"></span>
            </div>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <input type="text" id="perfil-nombre" placeholder="Nombre opcional">
                <input type="text" id="perfil-contacto" placeholder="WhatsApp / Redes opcional">
                <button class="btn-action" onclick="guardarPerfilLocal()">💾 Guardar Datos</button>
            </div>
        </aside>
    </div>

    <nav class="mobile-nav">
        <button class="nav-tab active" onclick="switchTab('view-render', this)">🎨 Editor</button>
        <button class="nav-tab" onclick="switchTab('view-catalogo', this)">🛍️ Catálogo</button>
        <button class="nav-tab" onclick="switchTab('view-perfil', this)">👤 Perfil</button>
    </nav>

    <div id="toast"></div>

    <script>
        // CONFIGURACIÓN Y ESTADO
        const GAS_WEB_APP_URL = ""; // Coloca aquí tu URL de Google Apps Script cuando esté desplegado.
        
        let userId = localStorage.getItem('user_id') || 'USR-' + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem('user_id', userId);

        let currentImgUrl = "";
        let tagSeleccionado = "Todos";
        
        const CAMISETA_HOMBRE_URL = "https://www.sobretodo.es/wp-content/uploads/2020/08/camiseta-hombre-basica-front.jpg";
        const CAMISETA_MUJER_URL = "https://static.vecteezy.com/system/resources/previews/050/705/095/non_2x/women-s-t-shirt-mockup-isolated-on-transparent-background-png.png";

        let categoriasDinamicas = JSON.parse(localStorage.getItem('categorias_db')) || [
            { nombre: 'Anime', uso: 12 },
            { nombre: 'Geek', uso: 8 },
            { nombre: 'Gaming', uso: 6 }
        ];

        let catalogoGlobal = JSON.parse(localStorage.getItem('catalogo_local')) || [];

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('user-id-display').innerText = userId;
            actualizarDatalistCategorias();
            cargarPerfilGuardado();
            renderCatalogo();
        });

        // --- INTERFAZ ADAPTATIVA Y CONTROL VISUAL ---
        function actualizarInterfazSoporte() {
            const soporte = document.getElementById('select-soporte').value;
            const wrapper = document.getElementById('contenedor-mockup');
            const controlesTarjeta = document.getElementById('controles-tarjeta');
            const controlesCamiseta = document.getElementById('controles-camiseta');

            if (soporte === 'camiseta') {
                controlesTarjeta.style.display = 'none';
                controlesCamiseta.style.display = 'flex';
                wrapper.innerHTML = `<div class="mockup-camiseta" id="tshirt-base"><div class="area-impresion" id="sticker-preview"></div></div>`;
                cambiarImagenCamiseta();
                cambiarColorCamiseta();
            } else {
                controlesTarjeta.style.display = 'flex';
                controlesCamiseta.style.display = 'none';
                wrapper.innerHTML = `<div class="tarjeta-mockup" id="sticker-preview"><div class="chip" id="card-chip"></div></div>`;
                cambiarOrientacion();
                toggleChip();
            }
            ajustarImagen();
        }

        function cambiarOrientacion() {
            const preview = document.getElementById('sticker-preview');
            const orientacion = document.getElementById('select-orientacion').value;
            if (preview && preview.classList.contains('tarjeta-mockup')) {
                if (orientacion === 'vertical') preview.classList.add('vertical');
                else preview.classList.remove('vertical');
            }
        }

        function toggleChip() {
            const chip = document.getElementById('card-chip');
            const checked = document.getElementById('check-chip').checked;
            if (chip) chip.style.display = checked ? 'block' : 'none';
        }

        function cambiarImagenCamiseta() {
            const genero = document.getElementById('select-genero-camiseta').value;
            const tshirtBase = document.getElementById('tshirt-base');
            if (tshirtBase) {
                const urlImg = (genero === 'hombre') ? CAMISETA_HOMBRE_URL : CAMISETA_MUJER_URL;
                tshirtBase.style.backgroundImage = `url('${urlImg}')`;
            }
        }

        function cambiarColorCamiseta() {
            const color = document.getElementById('color-camiseta').value;
            const tshirtBase = document.getElementById('tshirt-base');
            if (tshirtBase) tshirtBase.style.backgroundColor = color;
        }

        function switchFuenteImagen(tipo) {
            document.getElementById('btn-tab-file').classList.toggle('active', tipo === 'file');
            document.getElementById('btn-tab-url').classList.toggle('active', tipo === 'url');
            document.getElementById('sec-input-file').style.display = tipo === 'file' ? 'block' : 'none';
            document.getElementById('sec-input-url').style.display = tipo === 'url' ? 'block' : 'none';
        }

        function ajustarImagen() {
            const preview = document.getElementById('sticker-preview');
            const zoom = document.getElementById('slider-zoom').value;
            const repeat = document.getElementById('select-repeat').value;

            if (preview && currentImgUrl) {
                preview.style.backgroundImage = `url('${currentImgUrl}')`;
                preview.style.backgroundSize = `${zoom}%`;
                preview.style.backgroundRepeat = repeat;
            }
        }

        function cargarFotoLocal(e) {
            const file = e.target.files[0];
            if (file) {
                currentImgUrl = URL.createObjectURL(file);
                ajustarImagen();
            }
        }

        function cargarFotoURL() {
            const url = document.getElementById('url-input').value.trim();
            if (url) {
                currentImgUrl = url;
                ajustarImagen();
            }
        }

        // --- PUBLICACIÓN Y INTEGRACIÓN CON GOOGLE APPS SCRIPT ---
        function guardarDisenoComunitario() {
            const nombre = document.getElementById('nombre-diseno').value.trim() || "Diseño sin nombre";
            const categoria = document.getElementById('categoria-input').value.trim() || "Geek";

            if (!currentImgUrl) {
                mostrarToast("⚠️ Añade una imagen primero.");
                return;
            }

            const payload = { id: Date.now(), userId, nombre, tag: categoria, url: currentImgUrl };

            // Guardado Local
            catalogoGlobal.unshift(payload);
            localStorage.setItem('catalogo_local', JSON.stringify(catalogoGlobal));

            // Sincronización con Google Apps Script (Ligero)
            enviarAGoogleAppsScript(payload);

            mostrarToast("✨ Publicado exitosamente");
            renderCatalogo();
        }

        function enviarAGoogleAppsScript(datos) {
            if (!GAS_WEB_APP_URL) return; // Si aún no se ha configurado la URL de Apps Script

            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            }).catch(e => console.error("Error al enviar a GAS:", e));
        }

        // --- CATÁLOGO & PERFIL ---
        function actualizarDatalistCategorias() {
            categoriasDinamicas.sort((a, b) => b.uso - a.uso);
            document.getElementById('lista-categorias-dinamica').innerHTML = 
                categoriasDinamicas.map(c => `<option value="${c.nombre}">`).join('');
        }

        function renderCatalogo() {
            const contenedor = document.getElementById('contenedor-catalogo');
            const busqueda = document.getElementById('buscar-catalogo').value.toLowerCase();
            const tagsBar = document.getElementById('tags-bar');

            const tagsUnicos = ['Todos', ...new Set(categoriasDinamicas.map(c => c.nombre))];
            tagsBar.innerHTML = tagsUnicos.map(t => `
                <span class="tag-badge ${tagSeleccionado === t ? 'active' : ''}" onclick="filtrarPorTag('${t}')">${t}</span>
            `).join('');

            const filtrados = catalogoGlobal.filter(item => {
                const cumpleTag = tagSeleccionado === 'Todos' || item.tag === tagSeleccionado;
                return cumpleTag && (item.nombre.toLowerCase().includes(busqueda) || item.tag.toLowerCase().includes(busqueda));
            });

            contenedor.innerHTML = filtrados.map(item => `
                <div class="card-item" onclick="seleccionarDelCatalogo('${item.url}')">
                    <div class="card-img" style="background-image: url('${item.url}')"></div>
                    <div class="card-info">
                        <strong>${item.nombre}</strong><br>
                        <span style="color:var(--primary);">🏷️ ${item.tag}</span>
                    </div>
                </div>
            `).join('');
        }

        function filtrarPorTag(tag) { tagSeleccionado = tag; renderCatalogo(); }

        function seleccionarDelCatalogo(url) {
            currentImgUrl = url;
            ajustarImagen();
            switchTab('view-render', document.querySelectorAll('.nav-tab')[0]);
        }

        function pedirPorWhatsApp() {
            const nombre = document.getElementById('nombre-diseno').value || "Diseño Personalizado";
            const contacto = localStorage.getItem('user_contact') || "Cliente";

            const mensaje = encodeURIComponent(`Hola! Deseo ordenar este producto:\n📌 ID Usuario: ${userId}\n📌 Diseño: ${nombre}\n👤 Contacto: ${contacto}\n🖼️ Link: ${currentImgUrl}`);
            window.open(`https://wa.me/?text=${mensaje}`, '_blank');
        }

        function guardarPerfilLocal() {
            localStorage.setItem('user_name', document.getElementById('perfil-nombre').value);
            localStorage.setItem('user_contact', document.getElementById('perfil-contacto').value);
            mostrarToast("👤 Datos guardados.");
        }

        function cargarPerfilGuardado() {
            if (localStorage.getItem('user_name')) document.getElementById('perfil-nombre').value = localStorage.getItem('user_name');
            if (localStorage.getItem('user_contact')) document.getElementById('perfil-contacto').value = localStorage.getItem('user_contact');
        }

        function switchTab(viewId, btn) {
            document.querySelectorAll('.section-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            if (btn) btn.classList.add('active');
        }

        function mostrarToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
